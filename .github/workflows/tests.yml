name: Cross-platform tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate Windows entry points
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./platforms/windows/doctor.ps1
          & '.\Start Moyu Whistle.cmd' --doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node floating/check-whistle.cjs
      - run: python scripts/release_check.py
